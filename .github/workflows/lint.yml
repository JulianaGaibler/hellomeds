name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Check formatting
        run: ./gradlew spotlessCheck
