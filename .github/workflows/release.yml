name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.should_release }}
      version: ${{ steps.diff.outputs.version }}
      version_code: ${{ steps.diff.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tr -d '\r' guards against CRLF-edited version.properties — without it
          # the tag becomes "v0.1.4\r" and the release lookup never matches.
          NAME=$(grep '^APP_VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')
          CODE=$(grep '^APP_VERSION_CODE=' version.properties | cut -d= -f2 | tr -d '\r')
          # Check the Release, not just the tag — survives partial-failure
          # re-runs where the tag was created but the release upload failed.
          if gh release view "v$NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.HM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Validate F-Droid changelog and render release body
        run: ./gradlew validateReleaseNotes releaseBody

      - name: Build signed release artifacts
        env:
          CI: 'true'
          HM_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          HM_KEY_PASSWORD: ${{ secrets.HM_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleGoogleRelease :androidApp:assembleFdroidRelease

      # Preserve artifacts even if the release step fails — re-runs rebuild,
      # but a transient Releases API failure would otherwise discard them.
      - name: Stash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            androidApp/build/outputs/bundle/googleRelease/*.aab
            androidApp/build/outputs/apk/fdroid/release/*.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: build/release/release-body.md
          files: |
            androidApp/build/outputs/bundle/googleRelease/*.aab
            androidApp/build/outputs/apk/fdroid/release/*.apk
          target_commitish: ${{ github.sha }}
