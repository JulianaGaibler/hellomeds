unreleased:
  notes:
  - Clear a medication's logged doses and stock changes older than 24 hours, 7, 30 or 90 days
  - Past days before an import or a schedule change no longer show doses as unlogged
  - Fixed stock showing as zero after importing a backup without history
  - Importing a backup is now all or nothing, replacing a medication only changes what the backup contains, and schedules with an invalid time are skipped
  - Fixed editing a medication overwriting stock changes made while the screen was open
  - Backups now keep a medication's fixed time zone and bubble layout
  - Failed backup saves, unreadable backup files and failed dose logs now show a message
  - Fixed exported backups sometimes being saved as empty files
  - Shows a confirmation with a Show in Files button after saving a backup
  - HelloMeds is now only offered for HelloMeds backup files
  - Time zone and dosing cycle settings moved to their own pages when editing a medication
  - Changing a schedule or traveling to a new time zone no longer marks recent doses as taken or skipped, and missed doses from before a time zone change are settled in the time zone you were in
  - Refilling no longer stops older unlogged doses from reducing your stock
  - After more than 30 days without an update, HelloMeds asks before marking unlogged doses as skipped or taken
releases:
- version: 0.1.7
  versionCode: 16
  date: '2026-10-24'
  notes:
  - Doses you forget to log are now resolved reliably, even after being away for days
  - Choose per medication whether unlogged doses are marked as skipped or taken
  - Shows a summary of automatically logged doses when you return to the app
  - Updated to Material 3 1.5 and Compose 1.13
- version: 0.1.6
  versionCode: 15
  date: '2026-07-13'
  notes:
  - Fixed picking a color when creating or editing a medication
  - Fixed stock tracking graph grouping events from multiple days onto a single day
- version: 0.1.4
  versionCode: 12
  date: '2026-05-28'
  notes:
  - Improved UI for stock screen
  - Fixed bug with SwipeableListItem caching its swipe state
  - Removed verbose logging
  - Added closed beta sign-up link to README
