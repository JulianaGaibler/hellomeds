unreleased:
  notes: []
releases:
- version: 0.1.9
  versionCode: 18
  date: '2026-10-25'
  notes:
  - Fixed the alarm screen sitting under the status and navigation bars
- version: 0.1.8
  versionCode: 17
  date: '2026-10-25'
  notes:
  - Clear a medication's logged doses and stock changes
  - Reminders to turn on automatic backups
  - Offers a restore if your data can't be opened
  - Older app versions no longer wipe newer data
  - Backup imports are all or nothing, and saving or reading backups shows errors
  - Missed doses settle in the right time zone, with a prompt after 30+ days away
  - Fixed stock showing zero after an import and edits overwriting stock
  - Schedule dates no longer shift across time zones
- version: 0.1.7
  versionCode: 16
  date: '2026-10-24'
  notes:
  - Doses you forget to log are now resolved reliably, even after being away for days
  - Choose per medication whether unlogged doses are marked as skipped or taken
  - Shows a summary of automatically logged doses when you return to the app
  - Updated to Material 3 1.5 and Compose 1.13
- version: 0.1.6
  versionCode: 15
  date: '2026-07-13'
  notes:
  - Fixed picking a color when creating or editing a medication
  - Fixed stock tracking graph grouping events from multiple days onto a single day
- version: 0.1.4
  versionCode: 12
  date: '2026-05-28'
  notes:
  - Improved UI for stock screen
  - Fixed bug with SwipeableListItem caching its swipe state
  - Removed verbose logging
  - Added closed beta sign-up link to README
